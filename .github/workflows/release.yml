name: release

# Push a tag like v0.3.0: builds rex8s for macOS and Linux and attaches the
# archives (rex8s and rex8s-guard; rex8s setup installs the rest) to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # a fine-grained token with write access to vitalbh/homebrew-tap; when
      # it isn't set, the tap step is skipped
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            # no version in the name: releases/latest/download/rex8s_darwin_arm64.tar.gz
            # always points at the newest one (curl install, Homebrew)
            dir=rex8s_${os}_${arch}
            mkdir -p "dist/$dir"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$dir/rex8s" ./cmd/rex8s
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/$dir/rex8s-guard" ./cmd/rex8s-guard
            cp README.md LICENSE "dist/$dir/"   # rex8s setup writes the Lua file and the commands
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes --title "$GITHUB_REF_NAME"
      - name: update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          set -eu
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/vitalbh/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > tap/Formula/rex8s.rb
          cd tap
          git config user.name "rex8s release"
          git config user.email "noreply@github.com"
          git add Formula/rex8s.rb
          git commit -qm "rex8s $GITHUB_REF_NAME"
          git push -q
